# =============================================================================
# Lab07 Supply-Chain CI/CD Workflow
# =============================================================================
# This workflow implements a complete supply chain security pipeline with:
# - SBOM generation (CycloneDX format)
# - Vulnerability scanning (pip-audit)
# - Infrastructure as Code validation (Bicep & Terraform)
# - Manual approval gate
# - Dry-run deployment
# =============================================================================

name: Lab07 Supply-Chain CI/CD

# Workflow triggers
on:
  # Trigger on push to the pr-workflow branch
  push:
    branches:
      - lab07/pr-workflow

  
  # Trigger on pull requests targeting main
  pull_request:
    branches:
      - main

  
  # Allow manual workflow dispatch for testing
  workflow_dispatch:

# Set default permissions to read-only for security
permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

# Environment variables available to all jobs
env:
  PYTHON_VERSION: '3.11'
  WORKING_DIRECTORY: 'lab07'

# =============================================================================
# Job 1: Build - Generate SBOM and prepare artifacts
# =============================================================================
jobs:
  build:
    name: Build & Generate SBOM
    runs-on: ubuntu-latest
    
    steps:
      # Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      # Setup Python environment
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIRECTORY }}/requirements.txt'
      
      # Install project dependencies
      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Generate Software Bill of Materials (SBOM) using CycloneDX
      - name: Generate CycloneDX SBOM
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "::group::Installing CycloneDX BOM tool"
          pip install cyclonedx-bom
          echo "::endgroup::"
          
          echo "::group::Generating SBOM in CycloneDX format"
          python -m cyclonedx_py requirements -i requirements.txt -o sbom.xml
          echo "::endgroup::"
          
          echo "::notice::SBOM generated successfully at ${{ env.WORKING_DIRECTORY }}/sbom.xml"
          
          # Display SBOM statistics
          if [ -f sbom.xml ]; then
            echo "::group::SBOM Statistics"
            echo "File size: $(du -h sbom.xml | cut -f1)"
            echo "Component count: $(grep -c '<component' sbom.xml || echo '0')"
            echo "::endgroup::"
          fi
      
      # Upload SBOM as artifact for downstream jobs
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ env.WORKING_DIRECTORY }}/sbom.xml
          retention-days: 30
          if-no-files-found: error
      
      # Create a summary for the workflow run
      - name: Create build summary
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependencies installed successfully" >> $GITHUB_STEP_SUMMARY
          echo "✅ SBOM generated in CycloneDX format" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Python Version:** ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Working Directory:** ${{ env.WORKING_DIRECTORY }}" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# Job 2: Scan - Vulnerability scanning with pip-audit
# =============================================================================
  scan:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      # Checkout for requirements.txt access
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Setup Python for pip-audit
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      # Download SBOM artifact from build job
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: ${{ env.WORKING_DIRECTORY }}
      
      # Verify SBOM was downloaded
      - name: Verify SBOM
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f sbom.xml ]; then
            echo "::notice::SBOM artifact downloaded successfully"
            ls -lh sbom.xml
          else
            echo "::error::SBOM file not found after download"
            exit 1
          fi
      
      # Run pip-audit for vulnerability scanning
      - name: Run pip-audit vulnerability scan
        id: pip-audit
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
        run: |
          echo "::group::Installing pip-audit"
          pip install pip-audit
          echo "::endgroup::"
          
          echo "::group::Running vulnerability scan"
          pip-audit -r requirements.txt --format=json -o cve-report.json || echo "SCAN_FAILED=true" >> $GITHUB_ENV
          echo "::endgroup::"
          
          # Display scan summary
          if [ -f cve-report.json ]; then
            echo "::notice::CVE report generated at ${{ env.WORKING_DIRECTORY }}/cve-report.json"
            
            # Extract vulnerability count if jq is available
            if command -v jq &> /dev/null; then
              VULN_COUNT=$(jq '.dependencies | length' cve-report.json 2>/dev/null || echo "0")
              echo "::warning::Found $VULN_COUNT potential vulnerabilities"
            fi
          fi
      
      # Upload CVE report if scan found issues
      - name: Upload CVE report artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cve-report
          path: ${{ env.WORKING_DIRECTORY }}/cve-report.json
          retention-days: 90
          if-no-files-found: warn
      
      # Surface scan failures clearly with error annotation
      - name: Handle scan failures
        if: failure()
        run: |
          echo "::error title=Security Scan Failed::pip-audit detected vulnerabilities in dependencies"
          echo "## ❌ Security Scan Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required:** Review the CVE report artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the \`cve-report\` artifact to review detailed findings." >> $GITHUB_STEP_SUMMARY
          exit 1
      
      # Create success summary
      - name: Create scan summary
        if: success()
        run: |
          echo "## ✅ Security Scan Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No known vulnerabilities detected in dependencies." >> $GITHUB_STEP_SUMMARY

# =============================================================================
# Job 3: Validate IaC - Validate Bicep and Terraform files
# =============================================================================
  validate-iac:
    name: Validate Infrastructure as Code
    runs-on: ubuntu-latest
    needs: scan
    
    steps:
      # Checkout repository for IaC files
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Validate Bicep files if they exist
      - name: Validate Bicep files
        if: hashFiles('lab07/main.bicep') != ''
        run: |
          echo "::group::Installing Azure CLI Bicep extension"
          az bicep install
          az bicep version
          echo "::endgroup::"
          
          echo "::group::Validating Bicep templates"
          az bicep build --file lab07/main.bicep
          echo "::endgroup::"
          
          echo "::notice::Bicep validation completed successfully"
      
      # Validate Terraform files if they exist
      - name: Validate Terraform files
        if: hashFiles('lab07/main.tf') != ''
        run: |
          echo "::group::Installing Terraform"
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform
          terraform version
          echo "::endgroup::"
          
          echo "::group::Initializing Terraform (backend=false for validation)"
          cd lab07
          terraform init -backend=false
          echo "::endgroup::"
          
          echo "::group::Validating Terraform configuration"
          terraform validate
          terraform fmt -check
          echo "::endgroup::"
          
          echo "::notice::Terraform validation completed successfully"
      
      # Handle validation failures
      - name: Handle IaC validation failures
        if: failure()
        run: |
          echo "::error title=IaC Validation Failed::Infrastructure as Code validation detected errors"
          echo "## ❌ IaC Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Validation errors detected" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required:** Review and fix IaC syntax/configuration errors" >> $GITHUB_STEP_SUMMARY
          exit 1
      
      # Create validation summary
      - name: Create IaC validation summary
        if: success()
        run: |
          echo "## ✅ IaC Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f lab07/main.bicep ]; then
            echo "- ✅ Bicep templates validated" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f lab07/main.tf ]; then
            echo "- ✅ Terraform configuration validated" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ ! -f lab07/main.bicep ] && [ ! -f lab07/main.tf ]; then
            echo "- ℹ️ No IaC files found to validate" >> $GITHUB_STEP_SUMMARY
          fi

# =============================================================================
# Job 4: Manual Approval - Production deployment gate
# =============================================================================
  manual-approval:
    name: Manual Approval Gate
    runs-on: ubuntu-latest
    needs: validate-iac
    environment:
      name: production
      # Note: Configure required reviewers in repository Settings > Environments > production
    
    steps:
      # Simple approval acknowledgment step
      - name: Approval checkpoint
        run: |
          echo "::notice::All automated gates passed successfully"
          echo "::notice::Waiting for manual approval to proceed to deployment"
          echo "All gates passed. Pending approval."
          
          echo "## ✅ Manual Approval Checkpoint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** All automated checks passed" >> $GITHUB_STEP_SUMMARY
          echo "**Next Step:** Awaiting production environment approval" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Gates:" >> $GITHUB_STEP_SUMMARY
          echo "- Build & SBOM generation" >> $GITHUB_STEP_SUMMARY
          echo "- Security vulnerability scan" >> $GITHUB_STEP_SUMMARY
          echo "- Infrastructure as Code validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configure required reviewers:** Settings > Environments > production" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# Job 5: Deploy - Dry-run deployment (no actual deployment)
# =============================================================================
  deploy:
    name: Deploy (Dry-Run Only)
    runs-on: ubuntu-latest
    needs: manual-approval
    
    steps:
      # Checkout for deployment context
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Dry-run: Azure deployment (what-if)
      - name: Azure deployment dry-run (what-if)
        run: |
          echo "::group::Azure Deployment What-If Analysis"
          echo "Would run: az deployment group create --what-if"
          echo ""
          echo "Command would be:"
          echo "  az deployment group create \\"
          echo "    --resource-group <resource-group> \\"
          echo "    --template-file lab07/main.bicep \\"
          echo "    --parameters @lab07/parameters.json \\"
          echo "    --what-if"
          echo ""
          echo "::notice::This is a dry-run only. No actual Azure deployment will occur."
          echo "::endgroup::"
      
      # Dry-run: Terraform deployment (plan)
      - name: Terraform deployment dry-run (plan)
        run: |
          echo "::group::Terraform Deployment Plan"
          echo "Would run: terraform plan"
          echo ""
          echo "Command would be:"
          echo "  cd lab07"
          echo "  terraform init"
          echo "  terraform plan \\"
          echo "    -out=tfplan \\"
          echo "    -var-file=terraform.tfvars"
          echo ""
          echo "::notice::This is a dry-run only. No actual Terraform deployment will occur."
          echo "::endgroup::"
      
      # Create deployment summary
      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary (Dry-Run)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Dry-run completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production (simulated)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Would Execute:" >> $GITHUB_STEP_SUMMARY
          echo "- \`az deployment group create --what-if\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`terraform plan\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Complete Pipeline Status:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Build & SBOM generation" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Security vulnerability scan" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ IaC validation" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Manual approval" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ Deployment dry-run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** To enable actual deployments, remove dry-run steps and configure cloud credentials." >> $GITHUB_STEP_SUMMARY

# =============================================================================
# Workflow Configuration Notes
# =============================================================================
# 
# 📋 Setup Requirements:
# 1. Configure production environment in Settings > Environments
# 2. Add required reviewers to production environment
# 3. For actual deployments, add these secrets:
#    - AZURE_CREDENTIALS (for Azure deployments)
#    - TF_API_TOKEN (for Terraform Cloud)
# 
# 🔐 Security Best Practices:
# - Uses minimal permissions by default
# - Artifacts retained for audit trail (30-90 days)
# - Manual approval gate before deployment
# - Comprehensive error handling and notifications
# 
# 🔄 Customization Options:
# - Adjust retention days for artifacts
# - Add SARIF upload for GitHub Security tab integration
# - Add Slack/Teams notifications for failures
# - Configure scheduled scans (e.g., daily/weekly)
# 
# =============================================================================
